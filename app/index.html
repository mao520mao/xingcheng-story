<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1229" />
  <title>星橙故事铺</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 启动页（匹配 Figma 启动欢迎页 - IP 形象修正版） -->
  <div id="splash">
    <div class="splash-mascot">
      <img src="assets/splash.jpg" alt="星橙" class="splash-ip-img" />
    </div>
    <h1 class="splash-title">星橙故事铺</h1>
    <p class="splash-sub">小橙子，故事听完就睡吧</p>
    <div class="splash-bar-wrap">
      <div class="splash-bar-track">
        <div class="splash-bar-fill">
          <span class="splash-star-lead" aria-hidden="true">✦</span>
          <span class="splash-spark s1" aria-hidden="true"></span>
          <span class="splash-spark s2" aria-hidden="true"></span>
          <span class="splash-spark s3" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <p class="splash-loading">躺好了吗，故事要来了....</p>
  </div>

  <!-- 手机外壳 -->
  <div class="phone">
    <div class="screen" id="brightnessLayer">
      <!-- 首页星空粒子层（背景，置于内容之下） -->
      <div class="star-field" id="starField" aria-hidden="true"></div>
      <main id="screen"></main>
      <nav id="bottomNav" class="bottom-nav">
        <button class="nav-tab active" data-view="library">
          <!-- 图书馆：Figma 原始矢量 — 打开的书本 -->
          <span class="nav-icon-box">
            <svg class="nav-icon" width="26" height="23" viewBox="0 0 44 39" xmlns="http://www.w3.org/2000/svg"><path d="M22 39C20.4 37.7333 18.6667 36.75 16.8 36.05C14.9333 35.35 13 35 11 35C9.6 35 8.225 35.1833 6.875 35.55C5.525 35.9167 4.23333 36.4333 3 37.1C2.3 37.4667 1.625 37.45 0.975 37.05C0.325 36.65 0 36.0667 0 35.3V11.2C0 10.8333 0.0916667 10.4833 0.275 10.15C0.458333 9.81667 0.733333 9.56667 1.1 9.4C2.63333 8.6 4.23333 8 5.9 7.6C7.56667 7.2 9.26667 7 11 7C12.9333 7 14.825 7.25 16.675 7.75C18.525 8.25 20.3 9 22 10V34.2C23.7 33.1333 25.4833 32.3333 27.35 31.8C29.2167 31.2667 31.1 31 33 31C34.2 31 35.375 31.1 36.525 31.3C37.675 31.5 38.8333 31.8 40 32.2V8.2C40.5 8.36667 40.9917 8.54167 41.475 8.725C41.9583 8.90833 42.4333 9.13333 42.9 9.4C43.2667 9.56667 43.5417 9.81667 43.725 10.15C43.9083 10.4833 44 10.8333 44 11.2V35.3C44 36.0667 43.675 36.65 43.025 37.05C42.375 37.45 41.7 37.4667 41 37.1C39.7667 36.4333 38.475 35.9167 37.125 35.55C35.775 35.1833 34.4 35 33 35C31 35 29.0667 35.35 27.2 36.05C25.3333 36.75 23.6 37.7333 22 39ZM26 29V10L36 0V20L26 29ZM18 32.25V12.45C16.9 11.9833 15.7583 11.625 14.575 11.375C13.3917 11.125 12.2 11 11 11C9.76667 11 8.56667 11.1167 7.4 11.35C6.23333 11.5833 5.1 11.9333 4 12.4V32.25C5.16667 31.8167 6.325 31.5 7.475 31.3C8.625 31.1 9.8 31 11 31C12.2 31 13.375 31.1 14.525 31.3C15.675 31.5 16.8333 31.8167 18 32.25Z"/></svg>
          </span>
          <span>图书馆</span>
        </button>
        <button class="nav-tab" data-view="vault">
          <span class="nav-icon-box">
            <svg class="nav-icon" width="24" height="24" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M12 32L20 25.9L28 32L25 22.1L33 16.4H23.2L20 6L16.8 16.4H7L15 22.1L12 32ZM20 40C17.2333 40 14.6333 39.475 12.2 38.425C9.76667 37.375 7.65 35.95 5.85 34.15C4.05 32.35 2.625 30.2333 1.575 27.8C0.525 25.3667 0 22.7667 0 20C0 17.2333 0.525 14.6333 1.575 12.2C2.625 9.76667 4.05 7.65 5.85 5.85C7.65 4.05 9.7667 2.625 12.2 1.575C14.6333 0.525 17.2333 0 20 0C22.7667 0 25.3667 0.525 27.8 1.575C30.2333 2.625 32.35 4.05 34.15 5.85C35.95 7.65 37.375 9.7667 38.425 12.2C39.475 14.6333 40 17.2333 40 20C40 22.7667 39.475 25.3667 38.425 27.8C37.375 30.2333 35.95 32.35 34.15 34.15C32.35 35.95 30.2333 37.375 27.8 38.425C25.3667 39.475 22.7667 40 20 40Z"/></svg>
          </span>
          <span>星藏阁</span>
        </button>
        <button class="nav-tab" data-view="settings">
          <span class="nav-icon-box">
            <img src="assets/icons/icon_settings_inactive.png" class="nav-icon nav-icon-inactive" alt="设置" />
          <img src="assets/icons/icon_settings_active.png" class="nav-icon nav-icon-active" alt="设置" />
          </span>
          <span>设置</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- 星空装饰（背景） -->
  <div class="sky-deco" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/stories_data.js"></script>
  <script src="js/stories_user.js"></script>
  <script src="js/stories_cn.js"></script>
  <script src="js/stories_history.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 关闭启动页
    window.addEventListener('load', function () {
      setTimeout(function () {
        var sp = document.getElementById('splash');
        if (sp) sp.classList.add('hide');
      }, 1600);
    });
  </script>
</body>
</html>
